spring.application.name=expo-jpa

# ============================================================
# CONEXION A POSTGRESQL
# ============================================================
# Cambiar usuario, password y nombre de BD segun el entorno local.
# Crear la BD antes de arrancar:
#   psql -U postgres -c "CREATE DATABASE expo_jpa;"
spring.datasource.url=jdbc:postgresql://localhost:5432/expo_jpa
spring.datasource.username=postgres
spring.datasource.password=daniel122
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# COMPORTAMIENTO DE HIBERNATE
# ============================================================
# ddl-auto:
#   - none      -> no toca el esquema (produccion con Flyway/Liquibase)
#   - validate  -> valida que coincida con las entidades
#   - update    -> agrega columnas/tablas faltantes (DEV)
#   - create    -> borra y crea TODO al arrancar
#   - create-drop -> crea al arrancar, borra al apagar
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Permite que data.sql corra DESPUES de que Hibernate cree las tablas
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# ============================================================
# LOGGING UTIL PARA LA DEMO
# ============================================================
# Muestra los parametros bindeados (?, ?) con los valores reales
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ============================================================
# PUERTO DEL SERVIDOR
# ============================================================
server.port=8080
