# ============================================================
# PERFIL ALTERNATIVO: H2 EN MEMORIA (PLAN B PARA LA DEMO)
# ============================================================
# Activar con:  ./mvnw spring-boot:run -Dspring-boot.run.profiles=h2
# Consola web:  http://localhost:8080/h2-console
#   JDBC URL: jdbc:h2:mem:expo_jpa
#   user: sa  password: (vacio)

spring.datasource.url=jdbc:h2:mem:expo_jpa;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
